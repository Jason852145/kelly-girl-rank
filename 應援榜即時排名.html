<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>可莉女孩應援榜即時排名</title>
<meta name="description" content="可莉女孩應援榜 40 位參賽者即時票數排名，每 30 秒自動更新。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: scoreboard — sticky status bar, focus card, then one dense ranking list */
:root{
  --bg:#f3f5f9; --surface:#ffffff; --fg:#141a26; --muted:#5f6779; --line:#e1e5ee;
  --navy:#0b1e3a; --on-navy:#ffffff; --accent:#0b5cd6; --gold:#f2b705; --hl:#fff6d1;
  --up:#d93025; --down:#188038; --warn:#b3261e; --flash:#dceaff;
  --sans:"Noto Sans TC",-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;
  --num:"Barlow Condensed","Arial Narrow",var(--sans);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d1118; --surface:#161b25; --fg:#e7eaf1; --muted:#97a0b3; --line:#262d3b;
  --navy:#13284d; --on-navy:#ffffff; --accent:#7fb0ff; --gold:#f2c230; --hl:#3a3218;
  --up:#ff7a6e; --down:#5fd38a; --warn:#ff8a80; --flash:#1e3358; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1118; --surface:#161b25; --fg:#e7eaf1; --muted:#97a0b3; --line:#262d3b;
  --navy:#13284d; --on-navy:#ffffff; --accent:#7fb0ff; --gold:#f2c230; --hl:#3a3218;
  --up:#ff7a6e; --down:#5fd38a; --warn:#ff8a80; --flash:#1e3358; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.55 var(--sans);-webkit-text-size-adjust:100%}
.wrap{max-width:720px;margin:0 auto;padding-inline:16px}
.num{font-family:var(--num);font-variant-numeric:tabular-nums;letter-spacing:.01em}

header.top{background:var(--navy);color:var(--on-navy);padding-top:env(safe-area-inset-top,0px)}
header.top .wrap{padding-block:18px 16px;display:flex;flex-direction:column;gap:2px}
h1{margin:0;font-size:1.3rem;line-height:1.3;text-wrap:balance}
.period{font-size:13px;opacity:.75}

.bar{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;gap:10px;padding-block:8px;font-size:13px;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--down);flex:none}
.dot.off{background:var(--muted)}.dot.err{background:var(--warn)}
#status{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
button{font:inherit;cursor:pointer}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:4px 12px;font-size:13px}
.btn:hover{border-color:var(--accent);color:var(--accent)}
button:focus-visible,input:focus-visible,.row:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

main{display:flex;flex-direction:column;gap:14px;padding-block:14px 40px}

.focus{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-items:center}
.focus .rk{grid-row:span 2;font:700 44px/1 var(--num);color:var(--navy);min-width:2ch;text-align:center}
:root[data-theme="dark"] .focus .rk{color:var(--gold)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .focus .rk{color:var(--gold)}}
.focus .who{font-weight:700;font-size:16px;min-width:0;overflow-wrap:anywhere}
.focus .who small{font-weight:400;color:var(--muted);margin-left:6px;font-size:12px}
.focus .votes{font:600 22px/1.1 var(--num)}
.gaps{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px;border-top:1px solid var(--line);padding-top:10px}
.gap{display:flex;flex-direction:column;gap:0}
.gap span{font-size:12px;color:var(--muted)}
.gap b{font:600 19px/1.2 var(--num)}
.focus .hint{grid-column:1/-1;font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center}
.linkbtn{border:0;background:none;color:var(--accent);padding:0;font-size:12px}

.tools{display:flex;gap:8px;align-items:center}
#q{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:10px;padding:8px 12px;font:inherit;font-size:14px}
.total{font-size:12px;color:var(--muted);white-space:nowrap}

.board{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.head,.row{display:grid;grid-template-columns:3.2rem minmax(0,1fr) 5.6rem 4.6rem 2.6rem;align-items:center;gap:6px;padding:0 12px}
.head{font-size:12px;color:var(--muted);padding-block:8px;border-bottom:1px solid var(--line);background:var(--bg)}
.head span:nth-child(n+3),.row .r{text-align:right}
.row{padding-block:9px;border-bottom:1px solid var(--line);cursor:pointer;transition:background-color .6s}
.row:last-child{border-bottom:0}
.row:hover{background:var(--bg)}
.row.me{background:var(--hl)}
.row.flash{background:var(--flash);transition:none}
.pos{display:flex;align-items:baseline;gap:3px;white-space:nowrap}
.pos b{font:700 20px/1 var(--num);min-width:1.4ch;text-align:right}
.row.t1 .pos b{color:var(--gold)}
.mv{font:600 12px/1 var(--num)}.mv.up{color:var(--up)}.mv.dn{color:var(--down)}
.name{min-width:0;display:flex;flex-direction:column;line-height:1.3}
.name b{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.name small{font-size:11px;color:var(--muted)}
.v{font:600 18px/1 var(--num)}
.d{font:500 14px/1 var(--num);color:var(--muted)}
.d.plus{color:var(--accent)}
.p{font:500 15px/1 var(--num);color:var(--muted)}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}

footer{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
footer a{color:var(--accent)}

@media (max-width:480px){
  .head,.row{grid-template-columns:2.7rem minmax(0,1fr) 4.8rem 3.9rem;padding:0 10px}
  .head span:nth-child(5),.row .p{display:none}
  .gaps{grid-template-columns:repeat(3,1fr)}
  .focus .rk{font-size:38px}
}
@media (prefers-reduced-motion:reduce){.row{transition:none}}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <h1>可莉女孩應援榜・即時排名</h1>
  <div class="period">活動期間 10/1–10/13　資料來源：17LIVE 公開票數</div>
</div></header>

<div class="bar"><div class="wrap">
  <span class="dot off" id="dot"></span>
  <span id="status">讀取中…</span>
  <button class="btn" id="refresh" type="button">立即更新</button>
</div></div>

<div class="wrap"><main>
  <section class="focus" id="focus" aria-live="polite">
    <div class="rk num">–</div><div class="who">讀取中…</div><div class="votes num">&nbsp;</div>
  </section>

  <div class="tools">
    <input id="q" type="search" placeholder="搜尋號碼或名稱" aria-label="搜尋號碼或名稱" autocomplete="off">
    <span class="total" id="total"></span>
  </div>

  <section class="board" aria-label="票數排名">
    <div class="head"><span>名次</span><span>號碼・名稱</span><span>票數</span><span title="這次打開頁面之後增加的票數">開頁後</span><span>積分</span></div>
    <div id="list"><div class="empty">讀取中…</div></div>
  </section>

  <footer>
    <span>每 30 秒自動更新；切到其他分頁時暫停，回來會立刻更新。點任一列可設為關注對象。</span>
    <span>「開頁後」是你這次打開頁面之後增加的票數。積分依名次換算，同票者並列同名次、同積分，僅供參考，以官方公布為準。</span>
    <span><a href="bookmarklet.html">在 17LIVE 頁面用的書籤版</a></span>
  </footer>
</main></div>

<script>
(() => {
  const IDS = ["cd9c987f-d87d-4a91-84d5-c7b5d2c922ee","ec816dd4-905e-436d-9bad-8342b653c06d","05335f5d-fde7-4dd0-a630-78c81ca9c99c","ca7e77ab-4139-4a20-8b17-67662ce79d02","e17439eb-1d5e-46eb-81be-7fb6036ff2f5","c691dadd-c50d-4752-8789-eaf0f58ffa64","36e02a3a-faca-4c4f-8d61-6b2667a08068","e4cecdcc-3d8b-4038-8e89-5b717126cf9c","b961dbf8-6207-4a60-a752-5a05ff22095a","29273e41-84b5-4309-9225-0b3c8c26bed7","f4f636c7-f64f-4fe7-851f-e630f3bf8896","8813ecbc-fd0f-4812-b89f-ee7de90495d6","19eaa30b-9f4c-4910-90ad-34ea964d09c4","61a58914-c0d3-46e3-aef8-b86f7838937a","e09cf3ec-2295-4a1b-ae83-d9a34615cca5","aedb367a-677d-45fc-a6cc-a20104ee54dc","8a8f773d-791e-43a0-805f-d3db5b58bc88","1464bd38-5931-4645-b045-cb2015a74092","429a8d94-facc-41d9-a1fa-5311e82fbd83","b3058a80-1f1f-4c64-8392-bd2f0fa94f6c","2fd746fd-56e4-4698-902d-39c2090e868a","0935cb56-9add-4383-a5a4-3299979cb3c1","857caa94-14c3-453e-846a-cdb24077be74","998fe7cf-497f-4931-9ff0-ca22f192eaa3","032adacf-fc60-4376-845b-1cf6a052466b","57c7f76e-ce8b-4bc2-bbbb-358974f246db","44cce211-cd14-41d7-93c3-d69494f718ff","5d186df7-27f4-478a-8580-322503a58e9a","10fbeb47-f1ef-470a-a8fa-ba1dc977b7b3","afe8f71d-8815-4b74-883f-6c877dbe7c28","6e009d11-03d2-4b35-ab57-2c2c7602d7dd","9efadb25-e259-4f65-9b53-2c994fb20bec","de994b8a-d756-4b10-a9c3-62328b780ce4","9e0810c9-bc70-475b-ba14-162e67d4efc7","fd5e1f1c-fa1b-4748-8b02-5fd6963692c1","274951cc-9e17-4256-b5f1-579b1388eb2c","cbdb1390-ce17-44b1-8246-3fc4fc72d32c","13c70033-c028-4ed3-8ed9-84d8947dc089","444d9f95-faa6-466d-a2e7-ab419be694cc","2e296031-37ee-42c5-ade6-ed9bf06eda2f"];
  const NAMES = ["小玉","Yuetching627","哇系阿璇","小菜kristar","LyXi","百軒Miya","七依","Nikki_tzu.yu","切里Cherry","可鹽可甜Bona","李柒柒77","Yuni","吉拿Daily","奈奈大王","程茵","IRENE","陳玉婷yuting","恩玖","gii_0520","蘿拉Laura","布丁Purin","凡妮莎莎Vanessa","Tinana","小李子Yoni","mei.mei0601","ycyc_1010","e.mmmilk_","玟玟來啦","kapo6744","jieyuuuuu_","soyun257","悠悠","群群Chunni","Mina6627","Elsa.0104_","琪Qiyana","沛沛bae","Yoyo老師","珈珈出沒","iam豫晴兒"];
  const POINTS = [50,47,44,41,38,35,33,31,29,27,25,24,23,22,21,20,19,18,17,16,16,15,14,13,12,11,10,9,8,7,6,5,4,4,3,3,2,2,1,1];
  const API = id => "https://fireant.17app.co/api/v1/public/containers/" + id + "/summary";
  const INTERVAL = 30;
  const N = IDS.length;

  const $ = s => document.querySelector(s);
  const fmt = n => n.toLocaleString("en-US");
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  };

  const fromHash = () => { const m = location.hash.match(/^#(\d{1,2})$/); const n = m ? +m[1] : 0; return n >= 1 && n <= N ? n : 0; };
  let focus = fromHash() || store.get("kl_focus", 28);
  let votes = null, prev = null, base = null, baseRank = null, lastOk = 0, failing = false, timer = 0, countdown = INTERVAL, loading = false;

  // standard competition ranking: ties share the higher rank (1,2,2,4)
  const rankOf = v => { const r = []; for (let i = 0; i < N; i++) { let k = 1; for (let j = 0; j < N; j++) if (v[j] > v[i]) k++; r[i] = k; } return r; };
  const order = v => v.map((_, i) => i).sort((a, b) => v[b] - v[a] || a - b);

  async function load() {
    if (loading) return;
    loading = true;
    $("#dot").className = "dot off";
    const res = await Promise.all(IDS.map(id =>
      fetch(API(id), { cache: "no-store" }).then(r => r.ok ? r.json() : Promise.reject(r.status))
        .then(j => typeof j.total === "number" ? j.total : Promise.reject("no total")).catch(() => null)));
    loading = false;
    countdown = INTERVAL;
    if (res.some(v => v === null)) { failing = true; renderStatus(); return; }
    failing = false; lastOk = Date.now();
    prev = votes; votes = res;
    if (!base) { base = res.slice(); baseRank = rankOf(res); }
    render();
  }

  function renderStatus() {
    const dot = $("#dot"), st = $("#status");
    if (failing) {
      dot.className = "dot err";
      st.textContent = (lastOk ? "更新失敗，顯示 " + new Date(lastOk).toLocaleTimeString("zh-TW", { hour12: false }) + " 的資料" : "讀取失敗") + "，" + countdown + " 秒後重試";
      return;
    }
    if (!lastOk) return;
    const paused = document.hidden;
    dot.className = paused ? "dot off" : "dot";
    st.textContent = "更新於 " + new Date(lastOk).toLocaleTimeString("zh-TW", { hour12: false }) + (paused ? "　已暫停" : "　" + countdown + " 秒後更新");
  }

  function render() {
    renderStatus();
    const rank = rankOf(votes), ord = order(votes);
    $("#total").textContent = "總票數 " + fmt(votes.reduce((a, b) => a + b, 0));

    // focus card
    const i = focus - 1, pos = ord.indexOf(i);
    const above = pos > 0 ? ord[pos - 1] : -1, below = pos < N - 1 ? ord[pos + 1] : -1;
    const gained = votes[i] - base[i];
    $("#focus").innerHTML =
      '<div class="rk num">' + rank[i] + '</div>' +
      '<div class="who">' + focus + ' 號　' + esc(NAMES[i]) + '<small>第 ' + rank[i] + ' 名・積分 ' + POINTS[rank[i] - 1] + '</small></div>' +
      '<div class="votes num">' + fmt(votes[i]) + ' 票</div>' +
      '<div class="gaps">' +
        gapCell("距上一名", above < 0 ? "已是第一" : votes[above] === votes[i] ? "同票" : fmt(votes[above] - votes[i]) + " 票", above >= 0 ? (above + 1) + " 號 " + NAMES[above] : "") +
        gapCell("領先下一名", below < 0 ? "–" : votes[below] === votes[i] ? "同票" : fmt(votes[i] - votes[below]) + " 票", below >= 0 ? (below + 1) + " 號 " + NAMES[below] : "") +
        gapCell("開頁後增加", (gained > 0 ? "+" : "") + fmt(gained) + " 票", "") +
      '</div>' +
      '<div class="hint"><span>點下方任一列可換關注對象</span><button class="linkbtn" type="button" id="share">複製這位的分享連結</button></div>';

    // list
    const q = $("#q").value.trim().toLowerCase();
    let html = "";
    for (const k of ord) {
      const no = k + 1;
      if (q && !(String(no) === q || NAMES[k].toLowerCase().includes(q))) continue;
      const mv = baseRank[k] - rank[k];
      const d = votes[k] - base[k];
      const flash = prev && votes[k] !== prev[k];
      html += '<div class="row' + (no === focus ? " me" : "") + (rank[k] === 1 ? " t1" : "") + (flash ? " flash" : "") + '" data-n="' + no + '" tabindex="0" role="button" aria-label="' + no + ' 號 ' + esc(NAMES[k]) + '，第 ' + rank[k] + ' 名，' + votes[k] + ' 票">' +
        '<div class="pos"><b>' + rank[k] + '</b>' + (mv > 0 ? '<span class="mv up">▲' + mv + '</span>' : mv < 0 ? '<span class="mv dn">▼' + (-mv) + '</span>' : "") + '</div>' +
        '<div class="name"><b>' + esc(NAMES[k]) + '</b><small>' + no + ' 號</small></div>' +
        '<div class="r v">' + fmt(votes[k]) + '</div>' +
        '<div class="r d' + (d > 0 ? " plus" : "") + '">' + (d > 0 ? "+" + fmt(d) : "–") + '</div>' +
        '<div class="r p">' + POINTS[rank[k] - 1] + '</div></div>';
    }
    $("#list").innerHTML = html || '<div class="empty">找不到符合的參賽者</div>';
    if (prev) requestAnimationFrame(() => requestAnimationFrame(() => document.querySelectorAll(".row.flash").forEach(r => r.classList.remove("flash"))));
  }

  const gapCell = (label, value, sub) => '<div class="gap"><span>' + label + '</span><b>' + value + '</b>' + (sub ? '<span>' + esc(sub) + '</span>' : "") + '</div>';
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  function setFocus(n) {
    focus = n; store.set("kl_focus", n);
    try { history.replaceState(null, "", "#" + n); } catch (e) {}
    if (votes) render();
  }

  $("#list").addEventListener("click", e => { const r = e.target.closest(".row"); if (r) setFocus(+r.dataset.n); });
  $("#list").addEventListener("keydown", e => { if ((e.key === "Enter" || e.key === " ") && e.target.matches(".row")) { e.preventDefault(); setFocus(+e.target.dataset.n); } });
  $("#q").addEventListener("input", () => { if (votes) render(); });
  $("#refresh").addEventListener("click", load);
  $("#focus").addEventListener("click", e => {
    if (e.target.id !== "share") return;
    const url = location.href.split("#")[0] + "#" + focus, btn = e.target;
    const done = t => { btn.textContent = t; setTimeout(() => (btn.textContent = "複製這位的分享連結"), 2000); };
    try { navigator.clipboard.writeText(url).then(() => done("已複製連結 ✓"), () => done(url)); } catch (err) { done(url); }
  });
  window.addEventListener("hashchange", () => { const n = fromHash(); if (n && n !== focus) setFocus(n); });

  function tick() {
    if (document.hidden || loading) return;
    countdown--;
    if (countdown <= 0) load(); else renderStatus();
  }
  document.addEventListener("visibilitychange", () => {
    if (!document.hidden && lastOk && Date.now() - lastOk > INTERVAL * 1000) load(); else renderStatus();
  });
  timer = setInterval(tick, 1000);
  load();
})();
</script>
</body>
</html>
